services:
  - type: web
    name: ai-security-assistant
    runtime: python
    region: singapore
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
